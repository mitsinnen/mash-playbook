---
# Project source code URL: https://github.com/oliverlorenz/engelsystem

engelsystem_enabled: false

engelsystem_identifier: "{{ mash_playbook_service_identifier_prefix }}engelsystem"
engelsystem_base_path: "/{{ engelsystem_identifier }}"

# renovate: datasource=docker depName=ghcr.io/oliverlorenz/engelsystem/engelsystem
engelsystem_version: latest

engelsystem_uid: "{{ mash_playbook_uid }}"
engelsystem_gid: "{{ mash_playbook_gid }}"

# The hostname at which Engelsystem is served.
engelsystem_hostname: ""

engelsystem_container_image: "{{ engelsystem_container_image_registry_prefix }}oliverlorenz/engelsystem/engelsystem:{{ engelsystem_container_image_tag }}"
engelsystem_container_image_tag: "{{ engelsystem_version }}"
engelsystem_container_image_registry_prefix: "{{ engelsystem_container_image_registry_prefix_upstream }}"
engelsystem_container_image_registry_prefix_upstream: "{{ engelsystem_container_image_registry_prefix_upstream_default }}"
engelsystem_container_image_registry_prefix_upstream_default: ghcr.io/
engelsystem_container_image_force_pull: "{{ engelsystem_container_image.endswith(':latest') }}"

# Controls whether the Engelsystem container exposes its HTTP port (as defined by `engelsystem_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:8731"), or empty string to not expose.
engelsystem_container_http_host_bind_port: ""

# The base container network. It will be auto-created by this role if it doesn't exist already.
engelsystem_container_network: "{{ engelsystem_identifier }}"

# The port number in the container
engelsystem_container_http_port: 80
engelsystem_container_http_bind_port: ""

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to a reverse proxy, which runs in a different container network.
engelsystem_container_additional_networks: "{{ engelsystem_container_additional_networks_auto + engelsystem_container_additional_networks_custom }}"
engelsystem_container_additional_networks_auto: []
engelsystem_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
engelsystem_container_additional_volumes: []

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `engelsystem_container_labels_traefik_additional_response_headers_custom`
engelsystem_container_labels_traefik_additional_request_headers: "{{ engelsystem_container_labels_traefik_additional_request_headers_auto | combine(engelsystem_container_labels_traefik_additional_request_headers_custom) }}"
engelsystem_container_labels_traefik_additional_request_headers_auto: {}
engelsystem_container_labels_traefik_additional_request_headers_custom: {}
engelsystem_container_labels_traefik_priority: 0
engelsystem_container_labels_traefik_entrypoints: web-secure
engelsystem_container_labels_traefik_tls: "{{ engelsystem_container_labels_traefik_entrypoints != 'web' }}"

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `engelsystem_container_labels_traefik_additional_response_headers_custom`
engelsystem_container_labels_traefik_additional_response_headers: "{{ engelsystem_container_labels_traefik_additional_response_headers_auto | combine(engelsystem_container_labels_traefik_additional_response_headers_custom) }}"
engelsystem_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': engelsystem_http_header_xss_protection} if engelsystem_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': engelsystem_http_header_content_type_options} if engelsystem_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': engelsystem_http_header_content_security_policy} if engelsystem_http_header_content_security_policy else {})
    | combine ({'Permission-Policy': engelsystem_http_header_content_permission_policy} if engelsystem_http_header_content_permission_policy else {})
    | combine ({'Strict-Transport-Security': engelsystem_http_header_strict_transport_security} if engelsystem_http_header_strict_transport_security and engelsystem_container_labels_traefik_tls else {})
  }}
engelsystem_container_labels_traefik_additional_response_headers_custom: {}
# engelsystem_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
#
# Example:
# engelsystem_container_labels_additional_labels: |
#   my.label=1
#   another.label="here"
engelsystem_container_labels_additional_labels: ""

# A list of extra arguments to pass to the container
engelsystem_container_extra_arguments: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
engelsystem_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
engelsystem_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
engelsystem_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permission-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permission-Policy
engelsystem_http_header_content_permission_policy: "{{ 'interest-cohort=()' if engelsystem_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
engelsystem_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if engelsystem_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `engelsystem_content_permission_policy`
engelsystem_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `engelsystem_http_header_strict_transport_security`
engelsystem_hsts_preload_enabled: false

# List of systemd services that the engelsystem systemd service depends on
engelsystem_systemd_required_services_list: "{{ engelsystem_systemd_required_services_list_default + engelsystem_systemd_required_services_list_auto + engelsystem_systemd_required_services_list_custom }}"
engelsystem_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
engelsystem_systemd_required_services_list_auto: []
engelsystem_systemd_required_services_list_custom: []

engelsystem_environment_variable_db_type: mariadb
engelsystem_environment_variable_db_user: engelsystem
engelsystem_environment_variable_db_pass: engelsystem
engelsystem_environment_variable_db_name: engelsystem
engelsystem_environment_variables_additional_variables: ""
engelsystem_environment_variable_db_host_name: "{{ mariadb_identifier }}"

# List of systemd services that the engelsystem systemd service wants
engelsystem_systemd_wanted_services_list: []
